[versions]
agp = "9.2.1"
coreKtx = "1.18.0"
coreSplashscreen = "1.0.1"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.11.0-rc01"
activityCompose = "1.13.0"
kotlin = "2.3.21"
# Hilt (Android 권장 DI). Metro 대체. 2.59.2+ 가 AGP 9 호환(#5099/#5116 수정).
hilt = "2.59.2"
# androidx.hilt (hilt-navigation-compose / hilt-work / 컴파일러)
androidxHilt = "1.2.0"
composeBom = "2026.05.01"

# version
versionCode = "1"
versionName = "1.0.0"

# navigation
navigation3 = "1.1.2"
lifecycleViewmodelNavigation3 = "2.11.0-rc01"

# network
retrofit = "3.0.0"
okhttp = "5.3.2"
kotlinxSerialization = "1.11.0"
ksp = "2.3.9"

# lint
detekt = "2.0.0-alpha.3"
ktlintGradle = "14.2.0"
composeRulesKtlint = "0.5.9"
appcompat = "1.7.1"
material = "1.14.0"
jetbrainsKotlinJvm = "2.3.21"

# kakao
kakao = "2.23.2"

# google
appauth = "0.11.1"

# datastore
datastore = "1.2.1"
coroutines = "1.11.0"

# verification signals (Android 전용: Geofence/FusedLocation + 로컬 버퍼 Room)
playServicesLocation = "21.3.0"
room = "2.7.1"
# 백그라운드 sync 오케스트레이션
work = "2.10.0"
# 움직임/수면(HEALTH·SLEEP) 온디바이스 읽기. recordingMethod 메타데이터는 1.1.0+ 에서 제공(명세 §8.2).
healthConnect = "1.1.0-rc03"
# 지도(Kakao Map SDK v2). 네이티브 앱키/REST 키는 local.properties → BuildConfig 주입.
kakaoMap = "2.13.5"
# 기기 무결성 verdict(Play Integrity, 전송 스펙 §6.5) — graded 신뢰도 하향용
playIntegrity = "1.4.0"

# image
coil = "3.4.0"

# chart / calendar (마이 탭 통계·활동 캘린더)
calendarCompose = "2.7.0"
vico = "2.1.3"

# firebase
googleservice = "4.4.4"
firebaseCrashlyticsPlugin = "3.0.6"
firebaseBom = "34.14.0"
runtime = "1.11.2"

# architecture test
konsist = "0.17.3"

# logging (Android 단일 플랫폼 표준)
timber = "5.0.1"

# 성능(프레임 jank 측정) — 디버그 오버레이 로깅용
jankstats = "1.0.0-beta01"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
konsist = { group = "com.lemonappdev", name = "konsist", version.ref = "konsist" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }

# gradle plugin
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
compose-gradlePlugin = { group = "org.jetbrains.kotlin", name = "compose-compiler-gradle-plugin", version.ref = "kotlin" }
kotlin-serialization-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-serialization", version.ref = "kotlin" }

# lint
detekt-formatting = { module = "dev.detekt:detekt-formatting", version.ref = "detekt" }
ktlint-compose = { module = "io.nlopez.compose.rules:ktlint", version.ref = "composeRulesKtlint" }

# Hilt DI (Android 권장)
# 순수 도메인 모듈은 @Inject 생성자만 필요하므로 hilt 런타임 대신 javax.inject 만 의존한다.
javax-inject = { group = "javax.inject", name = "javax.inject", version = "1" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "androidxHilt" }
androidx-hilt-work = { group = "androidx.hilt", name = "hilt-work", version.ref = "androidxHilt" }
androidx-hilt-compiler = { group = "androidx.hilt", name = "hilt-compiler", version.ref = "androidxHilt" }

# navigation
androidx-navigation3-runtime = { group = "androidx.navigation3", name = "navigation3-runtime", version.ref = "navigation3" }
androidx-navigation3-ui = { group = "androidx.navigation3", name = "navigation3-ui", version.ref = "navigation3" }
androidx-lifecycle-viewmodel-navigation3 = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-navigation3", version.ref = "lifecycleViewmodelNavigation3" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeKtx" }
# collectAsStateWithLifecycle (androidx 단일 플랫폼)
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeKtx" }

# network
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-converter-kotlinx-serialization = { group = "com.squareup.retrofit2", name = "converter-kotlinx-serialization", version.ref = "retrofit" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# kakao
kakao-user = { module = "com.kakao.sdk:v2-user", version.ref = "kakao" }
kakao-share = { module = "com.kakao.sdk:v2-share", version.ref = "kakao" }

# google
app-auth = { module = "net.openid:appauth", version.ref = "appauth" }

# datastore
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-datastore-preferences-core = { group = "androidx.datastore", name = "datastore-preferences-core", version.ref = "datastore" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

# verification signals (Android 전용)
play-services-location = { group = "com.google.android.gms", name = "play-services-location", version.ref = "playServicesLocation" }
# GMS Task → 코루틴 await() 어댑터
kotlinx-coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "coroutines" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-work-runtime = { group = "androidx.work", name = "work-runtime", version.ref = "work" }
# 프레임 jank 측정(JankStats) — :app 의 MainActivity 에서 디버그 빌드만 트래킹
androidx-metrics-performance = { group = "androidx.metrics", name = "metrics-performance", version.ref = "jankstats" }
# Health Connect(움직임·수면 읽기) — androidMain 전용
androidx-health-connect-client = { group = "androidx.health.connect", name = "connect-client", version.ref = "healthConnect" }
# 지도(Kakao Map SDK v2) — :core:map / :app(KakaoMapSdk.init)
kakao-map = { module = "com.kakao.maps.open:android", version.ref = "kakaoMap" }
# Play Integrity(기기 무결성 verdict) — verification:data
play-integrity = { group = "com.google.android.play", name = "integrity", version.ref = "playIntegrity" }

# logging
timber = { group = "com.jakewharton.timber", name = "timber", version.ref = "timber" }

# image
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }

# chart / calendar (마이 탭 통계·활동 캘린더)
kizitonwose-calendar-compose = { module = "com.kizitonwose.calendar:compose", version.ref = "calendarCompose" }
vico-compose-m3 = { module = "com.patrykandpatrick.vico:compose-m3", version.ref = "vico" }

# firebase
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-analytics = { group = "com.google.firebase", name = "firebase-analytics" }
firebase-crashlytics = { group = "com.google.firebase", name = "firebase-crashlytics" }
androidx-compose-runtime = { group = "androidx.compose.runtime", name = "runtime", version.ref = "runtime" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

# lint
detekt = { id = "dev.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle" }

android-library = { id = "com.android.library", version.ref = "agp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
jetbrains-kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "jetbrainsKotlinJvm" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

# firebase
google-services = { id = "com.google.gms.google-services", version.ref = "googleservice" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "firebaseCrashlyticsPlugin" }
