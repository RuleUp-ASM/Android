# 모듈이 compileSdk 37 로 선언돼 있는데 Robolectric 은 자기가 지원하는 SDK 의 android-all jar 만
# 받아온다. 고정하지 않으면 없는 jar 를 찾다 실패한다. 테스트마다 @Config 를 붙이는 대신 파일 하나로
# 모듈 전체를 덮는다 — 새 테스트를 쓰는 사람이 이 사실을 몰라도 되게.
sdk=34

# 기본 화면은 좁아서(320dp) 스크롤 아래 내용이 "보이지 않음"으로 잡힌다. 실제 폰 크기로 맞춰
# assertIsDisplayed 가 레이아웃 우연에 흔들리지 않게 한다.
qualifiers=w411dp-h891dp-xhdpi
